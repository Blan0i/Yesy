; Localization target NodeFactory (spec 9.3): gathers the LOCTEXT/NSLOCTEXT texts of the plugin source
; (namespace NodeFactory) and the FText properties of the assets inside the plugin content.
; Run from the project folder; paths are relative to the project, the plugin lies in Plugins/NodeFactory:
;   UE4Editor-Cmd.exe <Project>.uproject -run=GatherText -config="Plugins/NodeFactory/Config/Localization/NodeFactory_Gather.ini"
; V-check: key names follow the configs the Localization Dashboard of UE 4.20 writes for game targets.

[CommonSettings]
SourcePath=Plugins/NodeFactory/Content/Localization/NodeFactory
DestinationPath=Plugins/NodeFactory/Content/Localization/NodeFactory
ManifestName=NodeFactory.manifest
ArchiveName=NodeFactory.archive
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/NodeFactory/Source
ExcludePathFilters=Plugins/NodeFactory/Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=true

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/NodeFactory/Content/*
ExcludePathFilters=Plugins/NodeFactory/Content/Localization/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=NodeFactory.csv
bConflictReport=true
ConflictReportName=NodeFactory_Conflicts.txt
