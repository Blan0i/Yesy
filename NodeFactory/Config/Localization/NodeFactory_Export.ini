; Writes Content/Localization/NodeFactory/<culture>/NodeFactory.po from the archives (Unreal PO format,
; msgctxt "NodeFactory,<Key>"). Run with -run=GatherText -config="Plugins/NodeFactory/Config/Localization/NodeFactory_Export.ini".

[CommonSettings]
SourcePath=Plugins/NodeFactory/Content/Localization/NodeFactory
DestinationPath=Plugins/NodeFactory/Content/Localization/NodeFactory
ManifestName=NodeFactory.manifest
ArchiveName=NodeFactory.archive
PortableObjectName=NodeFactory.po
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=ELocalizedTextCollapseMode::IdenticalTextIdAndSource
; V-check: POFormat is read by UE 4.20; older versions always use the Unreal format.
POFormat=EPortableObjectFormat::Unreal
