; Compiles the archives into Content/Localization/NodeFactory/<culture>/NodeFactory.locres, the files the editor
; loads for the target NodeFactory of NodeFactory.uplugin (LoadingPolicy Editor).
; Run with -run=GatherText -config="Plugins/NodeFactory/Config/Localization/NodeFactory_Compile.ini".

[CommonSettings]
SourcePath=Plugins/NodeFactory/Content/Localization/NodeFactory
DestinationPath=Plugins/NodeFactory/Content/Localization/NodeFactory
ManifestName=NodeFactory.manifest
ArchiveName=NodeFactory.archive
ResourceName=NodeFactory.locres
bSkipSourceCheck=false
bValidateFormatPatterns=true
bValidateSafeWhitespace=false
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=GenerateTextLocalizationResource
