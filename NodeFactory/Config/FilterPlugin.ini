[FilterPlugin]
; Additional files packaged with the plugin (spec 11.2). Paths are relative to the plugin root and may use
; "...", "*" and "?" wildcards. Source, Resources, Content and Config are packaged by the engine anyway.
;
; Example nodes of spec 11.3 in JSON form, importable through the Node Catalog:
/Presets/...
; Plugin passport and usage notes (spec 11.4):
/README.md
; Localization configs of the target NodeFactory (spec 9.3); the .locres, .archive and .po files are in Content:
/Config/Localization/...
